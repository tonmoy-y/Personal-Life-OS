name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (no credentials needed; app shows /setup without them)
        run: npm run build

  rls:
    # Applies every migration to a throwaway Postgres and runs the cross-user isolation tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql postgresql-contrib
      - name: RLS tests
        run: PGBIN="$(ls -d /usr/lib/postgresql/*/bin | tail -1)" ./scripts/test-rls.sh
